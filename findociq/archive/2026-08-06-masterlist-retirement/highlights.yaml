# ================================================== Selected balance sheet items ($m)
# GROSS, not net (2026-08-04). `bs.assets.customer_loans_gross` is the correct
# anchor -- it is what lineage_identity_map.csv authors for UOB, whose own
# review_flag records the policy: "for customer loans, we use Gross customer
# loans". The dashboard had been asking for `_net` while the authored anchor
# said `_gross`, so UOB's 352,180 never surfaced (docs/six-bug-diagnosis.md
# bug 3). Label follows the concept: a row labelled "Net" serving a gross
# figure would be worse than the original bug.
- label: "Gross customer loans"
  concept: bs.assets.customer_loans_gross
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

- label: "Customer deposits"
  concept: bs.liabilities.customer_deposits
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

- label: "Total assets"
  concept: bs.assets.total
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

- label: "Total liabilities"
  concept: bs.liabilities.total
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

- label: "Total equity"
  concept: bs.equity.total
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

- label: "Shareholders' equity"
  concept: bs.equity.shareholders
  unit_hint: "S$m"
  section: "Selected balance sheet items ($m)"

