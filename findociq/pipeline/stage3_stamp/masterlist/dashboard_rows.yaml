# PROPOSED human_confirmed rows for bank_line_map — the 26-item highlights dashboard.
#
# STATUS: APPROVED. Loaded as map_status='human_confirmed' by apply_dashboard_rows.py.
#
# Authored by READING each exhibit's structure (row order, indent depth, section
# headers, parent chain), never by matching a value to an expected figure.
# Standing rule: value-matching may propose a candidate, never confirm one —
# DBS commercial-book NII 14,494 sits within 0.05% of group NII 14,500, so a
# value match cannot tell them apart. The parent can.
#
# DBS anchors are taken from the GEOMETRY-branch layout (DBS_1Q26_trading_update),
# which is the trustworthy hierarchy. DBS_4Q25 is still model-branch and its
# parents differ (it has a phantom 'Selected income statement items' header row
# acting as parent, and 'Of which: Net interest income' is mis-parented to
# 'Markets trading Income'). Those anchors will MISS until the re-extraction
# sweep runs — which is correct: the map is the template, the document is what
# gets fixed.
#
# legal_entity: CONSOLIDATED throughout. For FS_BALANCE_STATUTORY rows this is
# now enforceable per-cell via the column-level axis (legal_entity_map), which
# separates DBS 68,916/17,643, UOB 572,061/485,263, OCBC 63,570/42,540.

rows:

# ═══════════════════════════ DBS ═══════════════════════════
# FS_INCOME_SELECTED — the two-book decomposition. The segment member is what
# stops the three NII rows and the two total-income rows colliding.
- {bank: DBS, tt: FS_INCOME_SELECTED, label: commercial_book_total_income,        parent: "",                            concept: pnl.income.total,                 segment: SEG_COMMERCIAL, basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: net_interest_income,                 parent: commercial_book_total_income,  concept: pnl.nii.net,                      segment: SEG_COMMERCIAL, basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: net_fee_and_commission_income,       parent: commercial_book_total_income,  concept: pnl.noninterest.fee_commission,   segment: SEG_COMMERCIAL, basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: treasury_customer_sales_and_other_income, parent: commercial_book_total_income, concept: pnl.noninterest.other,        segment: SEG_COMMERCIAL,
   note: "ELEMENT CORRECTION: was pnl.noninterest.trading. Treasury CUSTOMER SALES is customer flow, not trading.", basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: markets_trading_income,              parent: "",                            concept: pnl.income.total,                 segment: SEG_MARKETS,
   note: "ELEMENT CORRECTION: was pnl.noninterest.trading. This row is NII + non-II = total income of the markets book (6 + 1,368 = 1,374).", basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: net_interest_income,                 parent: markets_trading_income,        concept: pnl.nii.net,                      segment: SEG_MARKETS, basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: non_interest_income,                 parent: markets_trading_income,        concept: pnl.noninterest.total,            segment: SEG_MARKETS,
   note: "MEMBER ADDED: element was right, but with no member it impersonated the GROUP total 8,400. It is the markets cut, 1,368.", basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: total_income,                        parent: "",                            concept: pnl.income.total,                 segment: null, basis: underlying}   # 22,900 group
- {bank: DBS, tt: FS_INCOME_SELECTED, label: of_which_net_interest_income,        parent: total_income,                  concept: pnl.nii.net,                      segment: null,
   note: "ITEM 1. The GROUP NII, 14,500 = 14,494 commercial + 6 markets. NOT the bare commercial-book line.", basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: expenses,                            parent: "",                            concept: pnl.opex.total,                   basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: profit_before_allowances_and_amortisation, parent: "",                      concept: pnl.profit.operating,             basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: amortisation_of_intangible_assets,   parent: "",                            concept: pnl.opex.amortisation_intangibles, basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: allowances_for_credit_and_other_losses, parent: "", basis: underlying,                         concept: pnl.provisions.total}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: share_of_profits_losses_of_associates_and_jvs, parent: "", basis: underlying,                  concept: pnl.associates}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: profit_before_tax,                   parent: "",                            concept: pnl.profit.pretax,                basis: underlying}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: net_profit,                          parent: "",                            concept: pnl.profit.net_attributable,      basis: underlying,
   note: "11,033. The dashboard shows Net profit AND Reported net profit plus the one-time/CSR bridge, so BOTH bases are mapped."}
- {bank: DBS, tt: FS_INCOME_SELECTED, label: reported_net_profit,                 parent: "",                            concept: pnl.profit.net_attributable,      basis: reported,
   note: "D1 = REPORTED basis: 10,933. Same concept as the row above; only `basis` separates them."}
# FS_BALANCE_SELECTED — CORRECTED to parent: "" (top-level). These five were
# originally authored with parent: selected_balance_sheet_items, copied from
# the MODEL-branch layout (like the OCBC block below). But DBS's own geometry
# branch (DBS_1Q26_trading_update — the trustworthy hierarchy per the header
# note above) has all five at row_hierarchy=0 / row_parent NULL: there is no
# 'Selected balance sheet items' ROW, only a table TITLE. The old anchors
# (parent: selected_balance_sheet_items) stay in bank_line_map as deprecated,
# superseded_by the new top-level anchors — never deleted (MAPPING_LAYER §2.4.5).
- {bank: DBS, tt: FS_BALANCE_SELECTED, label: customer_loans,   parent: "", concept: bs.assets.customer_loans_gross,
   note: "D3-consistent: NET. Fixes the gross/net mis-stamp (one of the 2 backfill CONFLICTs)."}
- {bank: DBS, tt: FS_BALANCE_SELECTED, label: customer_deposits, parent: "", concept: bs.liabilities.customer_deposits}
- {bank: DBS, tt: FS_BALANCE_SELECTED, label: total_assets,      parent: "", concept: bs.assets.total}
- {bank: DBS, tt: FS_BALANCE_SELECTED, label: total_liabilities, parent: "", concept: bs.liabilities.total}
- {bank: DBS, tt: FS_BALANCE_SELECTED, label: shareholders_funds, parent: "", concept: bs.equity.shareholders}
- {bank: DBS, tt: FS_BALANCE_STATUTORY, label: total_equity,     parent: "",  concept: bs.equity.total,
   note: "ITEM 16. Group 68,916 vs Company 17,643 now separated by the COLUMN legal-entity axis, not by this row."}
# FS_RATIOS_KEY — 'Net interest margin - Group' vs '- Commercial Book' differ by LABEL, not parent
- {bank: DBS, tt: FS_RATIOS_KEY, label: net_interest_margin_group,          parent: "", concept: ratio.nim}
- {bank: DBS, tt: FS_RATIOS_KEY, label: net_interest_margin_commercial_book, parent: "", concept: ratio.nim, segment: SEG_COMMERCIAL}
- {bank: DBS, tt: FS_RATIOS_KEY, label: cost_income_ratio,                  parent: "", concept: ratio.cir}
- {bank: DBS, tt: FS_RATIOS_KEY, label: return_on_assets,                   parent: "", concept: ratio.roa}
- {bank: DBS, tt: FS_RATIOS_KEY, label: return_on_equity,                   parent: "", concept: ratio.roe}
- {bank: DBS, tt: FS_RATIOS_KEY, label: npl_ratio,                          parent: "", concept: ratio.npl}
- {bank: DBS, tt: FS_RATIOS_KEY, label: common_equity_tier_1_cet_1_ratio,   parent: "", concept: reg.capital.cet1_ratio}
# FS_PER_SHARE — parent-qualified, the whole reason EPS was unmappable before
- {bank: DBS, tt: FS_PER_SHARE, label: basic,           parent: earnings,          concept: pnl.eps.basic,   basis: underlying}
- {bank: DBS, tt: FS_PER_SHARE, label: diluted,         parent: earnings,          concept: pnl.eps.diluted, basis: underlying}
- {bank: DBS, tt: FS_PER_SHARE, label: basic,           parent: reported_earnings, concept: pnl.eps.basic,   basis: reported}
- {bank: DBS, tt: FS_PER_SHARE, label: diluted,         parent: reported_earnings, concept: pnl.eps.diluted, basis: reported,
   note: "FOUR EPS anchors, TWO concepts. DBS prints EPS on both bases (3.88/3.86 underlying, 3.84/3.82 reported); the basis attribute separates them, never a per-basis concept."}
- {bank: DBS, tt: FS_PER_SHARE, label: net_book_value,  parent: "", concept: bs.nav_per_share,
   note: "parent is TOP-LEVEL per geometry (1Q26). The model branch mis-parents it under 'Reported earnings' — a defect the sweep fixes."}

